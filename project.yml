name: KeyVault
options:
  bundleIdPrefix: com.keyvault305
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
  minimumXcodeGenVersion: "2.38.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"

targets:
  KeyVault:
    type: application
    platform: macOS
    sources:
      - KeyVault
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.keyvault305.app
        DEVELOPMENT_TEAM: T47L6TGCS8
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        INFOPLIST_FILE: KeyVault/Info.plist
        CODE_SIGN_ENTITLEMENTS: KeyVault/KeyVault.entitlements
        PRODUCT_NAME: KeyVault
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 2
    entitlements:
      path: KeyVault/KeyVault.entitlements
      properties:
        com.apple.security.app-sandbox: true
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.keyvault.app

  KeyVaultTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - KeyVaultTests
    dependencies:
      - target: KeyVault
